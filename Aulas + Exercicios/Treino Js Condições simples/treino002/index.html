<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número positivo ou negativo </title>
</head>
<body>
    <input type="Number" id="n"> 
    <input type="button" value="Verificar" onclick="calcular()"> 

    <div id="resposta"></div>
    
    <script>
        function calcular() {
            var n = document.getElementById ('n') 
            var resposta = document.getElementById ('resposta')

            var n=Number (n.value)

            resposta.innerHTML = `O numero escolhido foi ${n} `

            if (n>=0) { 
                resposta.innerHTML += `Numero postivo`
            } else { 
            resposta.innerHTML += `Numero negativo` }


        }
    </script>
</body>
</html>
