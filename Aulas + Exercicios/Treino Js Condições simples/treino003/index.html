<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de senha simples</title>
</head>
<body>
    <h1>Digite sua senha</h1>
    <input type="password" id="s">
    <input type="button" value="Verificar" onclick="calcular()">

    <div id="res"> </div>

    <script> 
        function calcular () { 
            var s = document.getElementById ('s')
            var res = document.getElementById ('res')
            var s=Number (s.value)

            if (s==1234) {res.innerHTML = `senha correta` }                                                             else { res.innerHTML= `senha incorreta`}
            
            


        }
    </script>

    
</body>
</html>
