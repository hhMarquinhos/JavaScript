<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body { 
            font: normal 20pt arial ;
        }
    </style>
</head>
<body>
    <script>
        var nome = prompt ('qual é o seu nome ?')
        document.write(`Olá,${nome}, seu nome tem ${nome.length} letras <br/>`) //write : escreva , document : documento 

        document.write (`Seu nome em maiúsculas é ${nome.toLocaleUpperCase()} <br/>`)
        
        document.write (`Seu nome em minuscula é ${nome.toLowerCase()}<br/>`)
    </script>
    
</body>
</html>
