<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">

    <style>
        body { 
            background-color: rgb(83, 83, 160);
            color: white;
            font: normal 18px arial ;
        }
    </style>
</head>
<body>
    <h1>iniciando estudos com <strong>DOM</strong> </h1>
    <p>aqui vai o resultado </p>
    <p> aprendendo a usar o<strong> DOM</strong> EM JS </p>
    <div id="msg">clique em mim </div> 
<script>
    var p1 = window.document.getElementsByTagName('p')[1] // p1 é o nome da variavel , P é a tag que quero selecionar e o [1] é o paragrafo , se fosse 0 , seria o primeiro paragrafo . o resultado é tudo que esta escrito abaixo de clique em mim  
    
    p1.style.color = 'blue' //mudança na letra do PARAGRAFO [1]

    window.document.write ('aqui vai o resultado : '+ p1.innerText) // innerText é o texto que esta dentro do P1 .o resultado é tudo que esta escrito abaixo de clique em mim . 
    

    var div = document.getElementById ('msg') //teste, selecionado objeto por id , inclui uma id na div linha (19)
    
    
    div.style.background = 'blacK'

    div.style.color = 'red'

   var div = document.querySelector ('div#msg')//apenas declarei o seletor que vou usar , no entanto não fiz nenhuma modificação usando o mesmo

   
  


   
   

 </script>
    
</body>
